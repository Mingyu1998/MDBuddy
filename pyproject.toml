[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbuddy"
version = "0.3.0"
description = "Agentic, reproducible builder for Martini coarse-grained membrane-protein systems in GROMACS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Mingyu Qin" }]
dependencies = ["pyyaml>=5.1"]

[project.optional-dependencies]
# everything a real build needs; matplotlib is imported by COBY 1.0.15 but not declared by it
build = ["vermouth>=0.13", "COBY>=1.0.15", "matplotlib", "numpy", "scipy", "mdtraj", "pdbfixer"]
dev = ["pytest>=7", "numpy"]

[project.scripts]
mdbuddy = "mdbuddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdbuddy = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
